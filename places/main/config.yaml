atmosphere:
  clouds:
    altitude: 600
    density: 0.35
    enabled: true
    opacity: 0.7
    thickness: 900
  fog:
    far: 1400
    kind: linear
    near: 600
  look:
    script: scripts/look-default.js
  moon:
    intensity: 3
  sky:
    kind: realistic
    model: hosek
  stars:
    density: 0.6
    enabled: true
    milkyWay: 0.6
  timeOfDay: 11.7
  wind:
    direction: 230
    speed: 2
defaultSpawnPoint:
  x: 0
  y:
    terrain: 0
  z: 0
