atmosphere:
  clouds:
    enabled: false
  fog:
    far: 900
    kind: linear
    near: 300
    color: "#000000"
  look:
    script: scripts/look-default.js
  moon:
    enabled: false
  sky:
    kind: color
    color: "#000000"
  stars:
    enabled: false
  timeOfDay: 0
  wind:
    direction: 230
    speed: 2
  ambient:
    light: {color: "#000000", intensity: 0}
