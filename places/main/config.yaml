  hemisphere:
    groundColor: "#000000"
    intensity: 0
    skyColor: "#000000"
defaultSpawnPoint:
  x: 0
  y: 0.1
  z: 16
gravity:
  x: 0
  y: -24
  z: 0
# 3d: the engine draws this place, so it needs 3D graphics to open. A game that is only its HTML screen is mode ui.
mode: 3d
terrain:
  kind: "off"
