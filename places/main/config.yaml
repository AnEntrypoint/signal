atmosphere:
  clouds:
    altitude: 600
    density: 0.35
    enabled: true
    opacity: 0.7
    thickness: 900
  fog:
    far: 1400
    kind: linear
    near: 600
  look:
    script: scripts/look-default.js
  moon:
    intensity: 3
  sky:
    kind: realistic
    model: hosek
  stars:
    density: 0.6
    enabled: true
    milkyWay: 0.6
  timeOfDay: 11.7
  wind:
    direction: 230
    speed: 2
defaultSpawnPoint:
  x: 0
  y:
    terrain: 0
  z: 0
gravity:
  x: 0
  y: -24
  z: 0
# 3d: the engine draws this place, so it needs 3D graphics to open. A game that is only its HTML screen is mode ui.
mode: 3d
terrain:
  decorations:
    bindings:
      grass:
        - flower
        - grass
        - pebble
    layers:
      flower:
        density: 0.6
        items:
          - colorJitter:
              hue: 8
              value: 0.1
            kind: scripted
            params:
              heart: "#7f95a3"
              petal: "#fbfcfb"
            randomRotation: true
            scale:
              - 0.8
              - 1.3
            script: scripts/flower.js
            seed: 1
            wind:
              force: 0.04
      grass:
        density: 56
        items:
          - kind: scripted
            randomRotation: true
            scale:
              - 0.5
              - 0.8
            script: scripts/grass.js
            seed: 1
            wind:
              force: 0.06
        material:
          kind: scripted
          script: scripts/grass-look.js
      pebble:
        density: 0.5
        items:
          - colorJitter:
              hue: 0
              value: 0.15
            kind: scripted
            params:
              stone: "#fbfcfb"
            randomRotation: true
            scale:
              - 0.6
              - 1.6
            script: scripts/pebble.js
            seed: 1
  generator: scripts/flat-starter-terrain.js
  kind: heightmap
  materials:
    - albedo: cdn/texture-terrain-grass-realistic-albedo-summer-exploration.png
      id: grass
      pbr: true
      tint: oklch(0.68 0.12 140)
    - albedo: cdn/texture-terrain-gravel-realistic-albedo.png
      id: gravel
      pbr: true
      tint: oklch(0.70 0.02 80)
    - albedo: cdn/texture-terrain-rock-realistic-albedo.png
      id: rock
      pbr: true
      tint: oklch(0.58 0.02 260)
  seed: 1
