<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>realm shell (local replacement)</title>
</head>
<body>
<script type="module">
import { bootstrapAuthoredRealm } from "https://play.spawn.co/v4/client/pool/01daf0ef-23ae0b033a02ce6d.mjs";

bootstrapAuthoredRealm(window, ({ port }) => {
  port.onmessage = (event) => {
    const message = event.data;
    if (message && message.kind === "render" && typeof message.html === "string") {
      document.body.innerHTML = message.html;
    }
    port.postMessage({ kind: "ready" });
  };
  port.postMessage({ kind: "ready" });
});
</script>
</body>
</html>
