# The score of the trip: the creator's track, measured (160 bpm exactly, first beat 0.35 s, 4/4, bar = 1.5 s,
# phrase = 8 bars = 12 s). Every shader, the sky, the look and the camera read these same numbers.
music: /cdn/music-fromage-retro-synthwave-beat-0c2764y0.mp3
bpm: 160
firstBeat: 0.35
duration: 198
kickFrom: 10.85     # the kick's pickup bar
kickTo: 190.85
# name: [start, end] seconds. What the music does there -> what the world does.
sections:
  seed:    [0, 12.35]        # near silence -> black void, one point, the Eye's lid opens
  pulse:   [12.35, 24.35]    # kick + bass, no highs -> iris rings fire outward on each beat
  bloom:   [24.35, 48.35]    # hats, then fuller -> the dot-mandala field grows from the centre out
  deep:    [48.35, 60.35]    # sub-bass breakdown -> dive through the pupil, slow and heavy
  flight:  [60.35, 84.35]    # full groove -> tunnel flight, stripes racing, serpents
  hex:     [84.35, 96.35]    # sub-bass, then a 2-bar fill dropping out at 93.35 -> hex chamber, neon line-art, hands reach
  reset:   [96.35, 108.35]   # stripped beat -> line-art mandala from above, colour drains back in
  ascent:  [108.35, 132.35]  # build -> every layer stacks, mirrors fold in
  peak:    [132.35, 180.35]  # full; brightest from 156.35 -> kaleidoscope, the sun-eye drips, everything turns
  return:  [180.35, 198]     # sub-bass, wash at 189.35, silence 192 -> pull back out, the lid closes
# Where things stand (metres, +Y up, the viewer starts at z=+16 looking toward -Z):
layout:
  field:   { centre: [0, 0, 0], radius: 90 }          # the mandala field on the ground, y = 0
  eye:     { centre: [0, 15, -34], radius: 15 }        # upright, faces +Z; pupil hole radius 5 is the tunnel mouth
  tunnel:  { from: [0, 15, -36], to: [0, 15, -336], radius: 6 }   # straight along -Z, 300 m
  chamber: { centre: [0, 15, -362], radius: 24 }       # hexagonal room at the tunnel's end, floor y = 3
# The layer score: when each layer is SHOWN, [from, to] seconds. Outside its windows a layer is cut away
# (discarded, so what is behind it shows). Each show and hide is a wipe travelling out from the composition
# centre over `wipe` seconds, so a layer uncovers the next instead of everything standing at once.
wipe: 3
# THE DECK (scripts/lib/deck.js): one scene per stretch between drops (energy.yml drops), dealt fresh each roll.
# The scene holds the whole stretch: its own clock stretched or tightened to fit, the camera cutting on the drop.
# seed (0-12.35) and return (180.35-198) stay put. 12 s stretches take a short scene, the rest a long one.
deck:
  segments: [[12.35, 48.35], [48.35, 84.35], [84.35, 96.35], [96.35, 180.35]]
  long: [bloom, flight, ascent, peak]
  short: [pulse, deep, hex, reset]
  seam: 2.5     # seconds either side of a drop over which pieces leave / arrive
piece: 2.25   # each fragment's own extra delay, 0..this many seconds (1.5 bars): layers change over piece by piece
layers:
  eye:      [[3.35, 57.35], [108.35, 195]]      # lids open at 3.35; cut away as we pass the pupil; back for ascent
  rays:     [[12.35, 36.35], [132.35, 180.35]]  # the lash/ray crown: pulse, gone while the field grows, back at peak
  field:    [[24.35, 51.35], [96.35, 189.35]]   # the ground mandala: bloom; alone in reset; under everything after
  stalks:   [[30.35, 51.35], [114.35, 180.35]]
  orbs:     [[36.35, 48.35], [144.35, 180.35]]
  serpents: [[42.35, 57.35], [120.35, 180.35]]
  sky:      [[108.35, 186.35]]                  # the sun-eye only exists from ascent
  tunnel:   [[51.35, 87.35]]
  chamber:  [[81.35, 97.35]]
  hands:    [[87.35, 97.35]]                    # reach in on the fill, last thing before the cut
# VISIONS: their slots are measured from the track itself: scripts/lib/data/energy.yml (tools/analyse-track.py).
# The lens, by section: bulge (barrel, + bulges toward us, - pinches), swirl (radians of twist at the centre,
# falling to 0 at the edge), fold (0..1 mirror the left half onto the right), hyper (0..0.6: a Mobius slide of the
# Poincare disc, the centre holds and the rim crushes toward infinity, the slide direction turning once per 24 s),
# droste (0..1: log-polar recursion, the frame repeats inside itself x4 smaller and zooms through, one copy per 12 s).
lens:
  seed:   { bulge: 0.0,  swirl: 0.0,  fold: 0, hyper: 0.0,  droste: 0 }
  pulse:  { bulge: 0.12, swirl: 0.0,  fold: 0, hyper: 0.0,  droste: 0 }
  bloom:  { bulge: 0.1,  swirl: 0.15, fold: 0, hyper: 0.35, droste: 0 }
  deep:   { bulge: -0.35, swirl: 0.5, fold: 0, hyper: 0.0,  droste: 1 }
  flight: { bulge: 0.45, swirl: 0.3,  fold: 0, hyper: 0.0,  droste: 0 }
  hex:    { bulge: 0.0,  swirl: 0.0,  fold: 1, hyper: 0.25, droste: 0 }
  reset:  { bulge: 0.0,  swirl: -0.25, fold: 0, hyper: 0.55, droste: 0 }
  ascent: { bulge: 0.15, swirl: 0.1,  fold: 0, hyper: 0.15, droste: 0 }   # calmer: the petal window carries the mirror
  peak:   { bulge: 0.3,  swirl: 0.3,  fold: 1, hyper: 0.45, droste: 0 }
  return: { bulge: -0.2, swirl: 0.0,  fold: 0, hyper: 0.0,  droste: 1 }
# The maths each section is COMPOSED with: a different family every time, never the same trick twice running.
# The piece that leads a section draws that section's pattern with that maths (win(c.sec, SEC.<name>)).
maths:
  seed:   "a single point and its circle inversions: one dot, then its images in nested circles (Apollonian gasket, 3 levels)"
  pulse:  "concentric wavefronts and their interference: two ring sources 1/3 apart, moire where they cross"
  bloom:  "phyllotaxis: bead n at angle n*137.508deg, radius c*sqrt(n); the 13/21/34 Fibonacci spirals lit as chases"
  deep:   "logarithmic spirals and Droste recursion: r = a*e^(b*theta), 5 arms, self-similar at x4"
  flight: "helices and torus knots on the tunnel wall: (p,q) = (3,8) stripes, diamond lattice where two helices cross"
  hex:    "the hexagonal lattice and its dihedral group D6: 6 mirrors, nested hexagons scaled by 1/sqrt(3) and turned 30deg each step"
  reset:  "hyperbolic tiling of the Poincare disc, {7,3}: heptagons shrinking to the rim, drawn as line-art"
  ascent: "rose curves and Lissajous figures: r = cos(k*theta), k stepping 3, 5/2, 7/3, 4 on the bar; superformula petals"
  peak:   "kaleidoscope: wallpaper group p6m folds over everything, Truchet arcs inside each wedge, all of the above at once"
  return: "inversion again: the whole picture mapped through one circle and shrunk back to the point it began as"
