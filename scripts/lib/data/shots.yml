# The camera's flight through the trip, seconds on the track. eye/aim in metres, fov degrees, roll degrees.
# cut: true = a hard cut to this key (always on a phrase boundary). Layout: scripts/lib/data/score.yml.
# TAS pace: the frame HOLDS, centred and symmetric, creeping in; the world moves inside it. One fast passage (flight).
keys:
  # seed: locked on the axis, far back, a creep toward the closed Eye
  - { t: 0,      eye: [0, 15, 78],    aim: [0, 15, -34],  fov: 26 }
  - { t: 12.35,  eye: [0, 15, 62],    aim: [0, 15, -34],  fov: 28 }
  # pulse: same axis, still creeping; the ripples come to us
  - { t: 24.35,  eye: [0, 14, 44],    aim: [0, 15, -34],  fov: 34 }
  # bloom: one slow rise over the field, a quarter orbit in 24 s
  - { t: 36.35,  eye: [22, 30, 30],   aim: [0, 6, -14],   fov: 42, roll: 3 }
  - { t: 48.35,  eye: [0, 24, 26],    aim: [0, 15, -34],  fov: 40 }
  # deep: line up on the pupil and sink in, heavy
  - { t: 54.35,  eye: [0, 15.5, -6],  aim: [0, 15, -60],  fov: 50 }
  - { t: 60.35,  eye: [0, 15, -40],   aim: [0, 15, -90],  fov: 64 }
  # flight: the one fast passage; dead centre, a single slow barrel roll across all 24 s
  - { t: 66.35,  eye: [0, 15, -104],  aim: [0, 15, -160], fov: 78, roll: 22, ease: linear }
  - { t: 72.35,  eye: [0, 15, -176],  aim: [0, 15, -230], fov: 82, roll: 45, ease: linear }
  - { t: 78.35,  eye: [0, 15, -250],  aim: [0, 15, -300], fov: 82, roll: 68, ease: linear }
  # hex: the flight slows into the room on the axis and creeps toward the hands (2026-11-11: no hard cuts)
  - { t: 84.35,  eye: [0, 15, -338],  aim: [0, 15, -364], fov: 62, roll: 90 }
  - { t: 93.35,  eye: [0, 15, -346],  aim: [0, 15, -366], fov: 50, roll: 30 }
  # reset: on the fill the camera pulls back out through the eye and rises until it hangs over the field
  - { t: 108.35, eye: [0, 96, 1],     aim: [0, 0, 0],     fov: 42, roll: 45 }
  # ascent: one unbroken spiral down and in
  - { t: 120.35, eye: [36, 44, 30],   aim: [0, 8, -12],   fov: 46, roll: 20 }
  - { t: 132.35, eye: [0, 18, 46],    aim: [0, 15, -34],  fov: 50 }
  # peak: front and mirrored; a slow push, one wide orbit, back to the axis
  - { t: 144.35, eye: [0, 12, 30],    aim: [0, 16, -34],  fov: 56 }
  - { t: 156.35, eye: [34, 20, 6],    aim: [0, 14, -30],  fov: 54, roll: -6 }
  - { t: 168.35, eye: [0, 34, 34],    aim: [0, 12, -30],  fov: 56 }
  - { t: 180.35, eye: [0, 15, 12],    aim: [0, 15, -34],  fov: 64 }
  # return: straight back out along the axis, the lid closes
  - { t: 189.35, eye: [0, 15, 48],    aim: [0, 15, -34],  fov: 38 }
  - { t: 198,    eye: [0, 15, 90],    aim: [0, 15, -34],  fov: 26 }
